name: One-time model comparison safety check
on:
  push:
    branches: [comparison/grok-claude-once-20261003]
permissions:
  contents: read
concurrency:
  group: model-comparison-once-20261003
  cancel-in-progress: false
jobs:
  grok46-web-once:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == '196ff01d5fe4f1dcfbc4b21644cf7e642be0ac46' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Test actual search evidence requirements
        run: node --test scripts/model-comparison/grok46-web-once.test.mjs scripts/model-comparison/native-transport.test.mjs
      - name: One actual web-search compatibility request
        env:
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/grok46-web-once.mjs
      - name: Retain sanitized actual tool evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grok46-web-once
          path: comparison-results/grok46-web-result.json
          if-no-files-found: ignore
          retention-days: 7
  grok46-long-stream-once:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == '9bac3cf1a734ed9c0423d585868d48c4fd3170d8' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Verify public long-stream completion checks
        run: node --test scripts/model-comparison/grok46-long-stream-once.test.mjs scripts/model-comparison/grok46-connect-once.test.mjs scripts/model-comparison/native-transport.test.mjs
      - name: One authorized public long-stream request without tools
        env:
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/grok46-long-stream-once.mjs
      - name: Retain public tutorial and sanitized stream evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grok46-long-stream-once
          path: comparison-results/grok46-long-stream-result.json
          if-no-files-found: ignore
          retention-days: 7
  grok46-connect-once:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == '4b2361bf2e8452f40a4da2708548f9881bf1e86d' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Check minimal request and safe reasoning usage handling
        run: node --test scripts/model-comparison/grok46-connect-once.test.mjs scripts/model-comparison/native-transport.test.mjs
      - name: One explicitly authorized Grok 4.6 connectivity request
        env:
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/grok46-connect-once.mjs
      - name: Retain sanitized greeting and diagnostic only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grok46-connect-diagnostic-once
          path: comparison-results/grok46-connect-result.json
          if-no-files-found: ignore
          retention-days: 7
  stream-chat-once:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == '8f28f0d8bbdb15c50344304f68f92340c724ce62' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Test bounded stream parser and diagnostic redaction
        run: node --test scripts/model-comparison/grok-chat-stream-once.test.mjs scripts/model-comparison/native-transport.test.mjs
      - name: One bounded non-reasoning stream Chat request
        env:
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/grok-chat-stream-once.mjs
      - name: Retain sanitized stream diagnostic only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grok-chat-stream-once
          path: comparison-results/grok-chat-stream-result.json
          if-no-files-found: ignore
          retention-days: 7
  chat-compatibility-once:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == 'f40e6da24005bbc2e1b1978ae0b28d77be0e26eb' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Check minimal compatibility request without credentials
        run: node --test scripts/model-comparison/grok-chat-once.test.mjs scripts/model-comparison/native-transport.test.mjs
      - name: One bounded non-reasoning Chat Completions request
        env:
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/grok-chat-once.mjs
      - name: Retain whitelist diagnostic and public greeting only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grok-chat-compatibility-once
          path: comparison-results/grok-chat-result.json
          if-no-files-found: ignore
          retention-days: 7
  prepare:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && (github.event.created == true || github.event.before == '0b0f9b6105d303c0c24800b6b5abd39a9e69123b') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Verify fail-closed safety checks
        run: node --test scripts/model-comparison/prepare.test.mjs
      - name: Zero-call preflight
        run: node scripts/model-comparison/prepare.mjs --preflight
  controlled-text:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == 'e040e360e486e0845608408ba536136f623e54fb' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Test bounded adapter without credentials
        run: node --test scripts/model-comparison/run-once.test.mjs
      - name: Single controlled text request and metadata read
        env:
          CLAUDE_TEST_KEY: ${{ secrets.claude_API_KEY }}
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/run-once.mjs
      - name: Retain sanitized public tutorial and usage only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-comparison-public-results
          path: comparison-results/results.json
          if-no-files-found: ignore
          retention-days: 7
  metadata-after-recovery:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == 'c9abd80933800b4ff544cd878b1b52c640a99fc5' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Read sanitized model catalogue without inference or retries
        env:
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/inspect-catalogue.mjs
  nonreason-comparison:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == 'ac34f2239c13396e29bd9c1c65788ebd15709b2d' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Test same-prompt budget and non-reasoning boundaries
        run: node --test scripts/model-comparison/grok-nonreason-once.test.mjs scripts/model-comparison/native-transport.test.mjs
      - name: One catalog check and one bounded non-reasoning Grok draft
        env:
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/grok-nonreason-once.mjs
      - name: Retain sanitized comparison text and usage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-comparison-grok-nonreason-result
          path: comparison-results/grok-nonreason-result.json
          if-no-files-found: ignore
          retention-days: 7
  public-seo-once:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == '05dfff5f9fc5e7dd15c351fb6eb7c1c117193798' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Check bounded public SEO review without credentials
        run: node --test scripts/model-comparison/grok-public-seo-once.test.mjs scripts/model-comparison/native-transport.test.mjs
      - name: One budgeted public-page SEO review without retries
        env:
          GROK_TEST_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/model-comparison/grok-public-seo-once.mjs
      - name: Retain sanitized public recommendations and usage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grok-public-article-recovery-once
          path: comparison-results/grok-public-seo-result.json
          if-no-files-found: ignore
          retention-days: 7
  transport-diagnostic:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == 'a9eb6b32ebf8e1e2dc85b91b80a71dabc037e122' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Diagnose public transport without credentials or inference
        run: node scripts/model-comparison/diagnose.mjs
  family-diagnostic:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.before == '558ab20b64a53998f52680f777bd0d86b0e82927' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Test native transport restrictions without credentials
        run: node --test scripts/model-comparison/run-once.test.mjs scripts/model-comparison/native-transport.test.mjs
      - name: Distinguish address families and native HTTPS without credentials
        id: network
        run: node scripts/model-comparison/diagnose-families.mjs
      - name: One authorized Claude retry only if public HTTPS succeeded
        if: steps.network.outputs.ready == 'true'
        env:
          PUBLIC_HTTPS_READY: ${{ steps.network.outputs.ready }}
          CLAUDE_TEST_KEY: ${{ secrets.claude_API_KEY }}
        run: node scripts/model-comparison/claude-retry-once.mjs
      - name: Retain sanitized retry result if produced
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-comparison-native-result
          path: comparison-results/claude-native-result.json
          if-no-files-found: ignore
          retention-days: 7
