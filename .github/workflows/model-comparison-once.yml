name: One-time model comparison safety check
on:
  push:
    branches: [comparison/grok-claude-once-20261003]
permissions:
  contents: read
concurrency:
  group: model-comparison-once-20261003
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'CordHerald39/nekobox.com.cn' && github.ref == 'refs/heads/comparison/grok-claude-once-20261003' && github.event.created == true && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/model-comparison
      - name: Verify fail-closed safety checks
        run: node --test scripts/model-comparison/prepare.test.mjs
      - name: Zero-call preflight
        run: node scripts/model-comparison/prepare.mjs --preflight

